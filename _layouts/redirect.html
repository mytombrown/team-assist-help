<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Moved</title>
<link rel="canonical" href="{{ page.target | absolute_url }}">
<meta http-equiv="refresh" content="0; url={{ page.target | relative_url }}">
<meta name="robots" content="noindex">
<script>location.replace({{ page.target | relative_url | jsonify }} + location.hash);</script>
</head>
<body><p>This page moved to <a href="{{ page.target | relative_url }}">{{ page.target | absolute_url }}</a>.</p></body>
</html>
