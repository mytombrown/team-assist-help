# ---------------------------------------------------------------------------
# Team Assist Help — Jekyll configuration
#
# Hosted on GitHub Pages from its own repository, separate from
# team-assist-legal so that help edits can never touch legally-reviewed pages.
# ---------------------------------------------------------------------------

title: Team Assist Help
description: >-
  Help and support for Team Assist — setup, features, chat, connections
  and troubleshooting.

# Change this if the site ends up somewhere other than help.mytombrown.com.
url: "https://help.mytombrown.com"
baseurl: ""

# The legal pages live in a different repo and must keep their current URLs.
legal:
  privacy: "https://legal.mytombrown.com/privacy/"
  delete_account: "https://legal.mytombrown.com/delete-account/"

support_email: "appstoresupportwithasmile@icloud.com"

# Shown at the top of every page. Set to false to hide.
beta_notice: "Team Assist is in active development. Some details below may change between releases."

# Category order on the index page. An article's `category` must match an id
# here or it won't appear on the index (tools/check_review.py catches that).
help_categories:
  - id: getting-started
    title: Getting Started
    blurb: Who Team Assist is for, and how to set yourself up.
  - id: trainers
    title: For Trainers
    blurb: Private and small-group training — athletes, sessions, packages and payments.
  - id: coaches
    title: For Coaches
    blurb: Teams, practices and games, assistant coaches, and the families on your teams.
  - id: shared
    title: Coaches & Trainers
    hidden: true
  - id: chat
    title: Team Chat
    blurb: Messaging, and what the status banners mean.
  - id: connections
    title: Connections & Visibility
    blurb: Connecting with parents and adult athletes, and who can see what.
  - id: parents
    title: For Parents & Athletes
    blurb: Using the Athlete profile — sessions, booking, packages, and connecting to a coach.
  - id: account
    title: Account & Privacy
    blurb: How your identity works, and where your data is covered.
  - id: support
    title: Support
    blurb: Getting help from a person.

# Categories for the other apps' help (_guides/). Every app uses these three.
guide_categories:
  - id: getting-started
    title: Getting Started
  - id: how-to
    title: How To
  - id: help
    title: Problems & Contact

collections:
  articles:
    output: true
    permalink: /teamassist/:name/
  # Old Team Assist URLs (before 10/16 every article lived at /<slug>/): the app and
  # the App Store listing link to them, so each one forwards to /teamassist/<slug>/.
  redirects:
    output: true
    permalink: /:name/
  # Every other app's help (10/17). One folder per app under _guides/; the app
  # itself is listed in _data/apps.yml. URL: /<app id>/<slug>/.
  guides:
    output: true
    permalink: /:path/

defaults:
  - scope:
      path: ""
      type: redirects
    values:
      layout: redirect
      sitemap: false
  - scope:
      path: ""
      type: guides
    values:
      layout: guide
  - scope:
      path: ""
      type: articles
    values:
      layout: article
      needs_review: false

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

exclude:
  - README.md
  - DEPLOY.md
  - tools/
  - Gemfile
  - Gemfile.lock
  - vendor/
